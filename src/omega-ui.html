<div id="raid-mission" class="raid-contract" hidden aria-live="polite" aria-label="突発ボーナス目標">

  <h3 id="raid-title">作戦を受信中</h3>
  <p id="raid-instruction">マーカーへ進み、目標を達成せよ。</p>
  <div class="raid-task-line"><span id="raid-progress">0 / 3</span><span class="raid-task-caption">REWARD: +65% OVERDRIVE</span></div>
  <div class="raid-meter-track"><i id="raid-meter" style="width:0%"></i></div>
  <div class="raid-run-stats" hidden><span>コア <b id="raid-cores">0 / 5</b></span><span>失敗 <b id="raid-misses">0 / 4</b></span></div>

  <div class="omega-core-line"><strong id="omega-core">ASSEMBLING</strong><span id="omega-trait">I / 0</span></div>
  <div class="omega-build-info"><span id="omega-parts">CURRENT WEAPON</span><span id="omega-info">MAGAZINE / RELOAD</span></div>
  <div id="omega-help">突発目標を達成するとOVERDRIVEゲージ +65%（発動中は+3.0s延長）＆耐久回復。</div>
  <button id="raid-reroll" type="button" hidden><span>REROLL</span></button>
</section>
